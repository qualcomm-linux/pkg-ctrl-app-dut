name: Build Package Reusable Workflow

on:
  workflow_call:
    inputs:
      debian-ref:
        description: The package repo ref to build
        required: true
        type: string

    secrets:
      DEBUSINE_USER:
        required: false
      DEBUSINE_TOKEN:
        required: false

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build source package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout package repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.debian-ref }}
          path: package-repo

      - name: Debug package repo
        shell: bash
        run: |
          set -euxo pipefail

          echo "Repository: ${{ github.repository }}"
          echo "Debian ref: ${{ inputs.debian-ref }}"

          git -C package-repo log -1 --oneline

          test -f package-repo/upstream.conf
          ls -l package-repo/upstream.conf

      - name: Download Prebuilt Binary Archive
        shell: bash
        run: |
          set -euxo pipefail

          pkg_dir="${GITHUB_WORKSPACE}/package-repo"
          upstream_conf="${pkg_dir}/upstream.conf"

          # shellcheck disable=SC1090
          source "${upstream_conf}"

          : "${URL:?URL is not defined in upstream.conf}"
          : "${FILE:?FILE is not defined in upstream.conf}"

          echo "URL  : ${URL}"
          echo "Tag  : ${TAG:-}"
          echo "File : ${FILE}"

          curl \
            --fail \
            --location \
            --retry 3 \
            --output "${pkg_dir}/${FILE}" \
            "${URL}"

          tar -xzf "${pkg_dir}/${FILE}" -C "${pkg_dir}"

      - name: Install source package tools
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      - name: Build Debian Source Package
        shell: bash
        run: |
          set -euxo pipefail

          pkg_dir="${GITHUB_WORKSPACE}/package-repo"

          cd "${pkg_dir}"

          echo "[source-pkg] Working directory: $(pwd)"
          echo "[source-pkg] Running dpkg-source -b ..."

          dpkg-source -b .

          echo "[source-pkg] Source package generated:"
          find "${GITHUB_WORKSPACE}" -maxdepth 1 -type f \
            \( \
              -name "*.dsc" \
              -o -name "*.orig.tar.*" \
              -o -name "*.debian.tar.*" \
            \) \
            -print

          test -n "$(find "${GITHUB_WORKSPACE}" -maxdepth 1 -type f -name '*.dsc' -print -quit)"

          echo "[source-pkg] Successfully built source package"

      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: wlan-service-source-package
          path: |
            ${{ github.workspace }}/*.dsc
            ${{ github.workspace }}/*.orig.tar.*
            ${{ github.workspace }}/*.debian.tar.*
          if-no-files-found: error
